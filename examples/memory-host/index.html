<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>live-translate — memory host</title>
  </head>
  <body>
    <div class="stage">
      <header class="top">
        <h1 class="wordmark">
          Phiên&nbsp;dịch <em>live</em>
          <span class="pair"><b class="en">EN</b><i>⇄</i><b class="vi">VI</b></span>
        </h1>
        <div class="status" id="status" data-state="idle">
          <span class="dot"></span><span id="status-text">sẵn sàng</span>
        </div>
      </header>

      <main class="feed" id="feed">
        <div class="empty" id="empty">
          <p class="empty-vi">Nhấn nút mic để bắt đầu</p>
          <p class="empty-en">tap the microphone to start — reference host for @sqrdao/live-translate</p>
        </div>
      </main>

      <footer class="deck">
        <p class="hint">
          <span id="hint-text">In-memory sink · no cloud service · translations appear as live text</span>
        </p>
        <div class="controls">
          <div class="spacer"></div>
          <button class="mic" id="mic" aria-label="Start translating">
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-2.56A8 8 0 0 0 20 11.5h-2Z"
              />
            </svg>
          </button>
          <div class="spacer"></div>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

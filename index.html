<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Phiên Dịch Live — EN ⇄ VI</title>
  </head>
  <body>
    <div class="stage">
      <header class="top">
        <h1 class="wordmark">
          Phiên&nbsp;dịch <em>live</em>
          <span class="pair"><b class="en">EN</b><i>⇄</i><b class="vi">VI</b></span>
        </h1>
        <div class="status" id="status" data-state="idle">
          <span class="dot"></span><span id="status-text">sẵn sàng</span>
        </div>
      </header>

      <nav class="modes" id="modes">
        <button class="mode active" data-mode="conversation">
          <strong>Hội thoại</strong><small>two-way conversation</small>
        </button>
        <button class="mode" data-mode="speech">
          <strong>Diễn thuyết</strong><small>one-way speech</small>
        </button>
      </nav>

      <div class="direction hidden" id="direction">
        <span class="lang-chip" id="dir-from" data-lang="en">English</span>
        <button class="swap" id="swap" title="Đổi chiều dịch" aria-label="Swap direction">⇄</button>
        <span class="lang-chip" id="dir-to" data-lang="vi">Tiếng Việt</span>
      </div>

      <main class="feed" id="feed">
        <div class="empty" id="empty">
          <p class="empty-vi">Nhấn nút mic để bắt đầu</p>
          <p class="empty-en">tap the microphone to start translating</p>
        </div>
      </main>

      <footer class="deck">
        <p class="diag hidden" id="diag"></p>
        <p class="hint">
          <span id="hint-text">Bản dịch hiển thị trực tiếp dạng chữ · translations appear as live text</span>
        </p>
        <div class="controls">
          <select id="mic-select" class="mic-select" aria-label="Microphone">
            <option value="">Mic mặc định</option>
          </select>
          <button class="mic" id="mic" aria-label="Start translating">
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-2.56A8 8 0 0 0 20 11.5h-2Z"
              />
            </svg>
          </button>
          <div class="spacer"></div>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
